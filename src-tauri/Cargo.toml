[package]
name = "markitdown-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Desktop window for converting files to Markdown"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
markitdown = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
