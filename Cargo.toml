[package]
name = "markitdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Convert files to Markdown for LLM and text pipelines"
readme = "README.md"
keywords = ["markdown", "pdf", "docx", "document", "llm"]
categories = ["text-processing", "command-line-utilities"]

[workspace]
members = [".", "src-tauri"]
resolver = "2"

[[bin]]
name = "markitdown"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
csv = "1"
serde_json = "1"
quick-xml = "0.38"
chardetng = "0.1"
encoding_rs = "0.8"
infer = "0.19"
base64 = "0.22"
percent-encoding = "2"
url = "2"
zip = "2"

undoc = { version = "0.27", optional = true }
unpdf = { version = "0.51", optional = true }
htmd = { version = "0.5", optional = true }
scraper = { version = "0.26", optional = true }
feed-rs = { version = "2", optional = true }
msg_parser = { version = "0.3", optional = true }
imagesize = { version = "0.13", optional = true }
kamadak-exif = { version = "0.6", optional = true }
lofty = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
zip = "2"

[features]
default = ["pdf", "office", "html", "rss", "epub", "outlook", "image", "audio", "url", "cli"]
pdf = ["dep:unpdf"]
office = ["dep:undoc"]
html = ["dep:htmd", "dep:scraper"]
rss = ["dep:feed-rs", "html"]
epub = ["html"]
outlook = ["dep:msg_parser", "html"]
image = ["dep:imagesize", "dep:kamadak-exif"]
audio = ["dep:lofty"]
url = ["dep:reqwest"]
cli = ["dep:clap"]
